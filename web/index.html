<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spotjspf</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b909c;
    --accent: #1db954;
    --danger: #e5484d;
    --warn: #e5b04d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s;
  }
  .drop.drag { border-color: var(--accent); }
  .drop input { display: none; }
  .drop p { margin: 6px 0; color: var(--muted); font-size: 14px; }
  .drop strong { color: var(--text); }
  button {
    background: var(--accent);
    color: #06210f;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.msg { color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.queued { background: #2a2e38; color: var(--muted); }
  .badge.downloading { background: #2a3a2e; color: var(--warn); }
  .badge.completed { background: #163a26; color: var(--accent); }
  .badge.failed { background: #3a1f21; color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .match { color: var(--muted); font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>spotjspf</h1>
  <p class="sub">Upload a JSPF playlist and downloads start immediately via spotdl.</p>

  <div class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".jspf,.json,application/json">
      <p><strong>Click to choose</strong> or drag a .jspf / .json file here</p>
      <p id="filename"></p>
    </label>
    <div style="margin-top:14px; display:flex; align-items:center; gap:12px;">
      <button id="uploadBtn" disabled>Upload &amp; download</button>
      <div id="status"></div>
    </div>
  </div>

  <div class="panel">
    <h2 style="font-size:15px; margin:0 0 14px;">Recent downloads</h2>
    <table>
      <thead>
        <tr><th>Track</th><th>Status</th><th>Match</th><th>Detail</th><th>Started</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="emptyMsg" class="empty" style="display:none;">No downloads yet.</div>
  </div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const filenameEl = document.getElementById('filename');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');
let selectedFile = null;

drop.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function setFile(f) {
  selectedFile = f;
  filenameEl.textContent = f.name;
  uploadBtn.disabled = false;
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  statusEl.textContent = 'Uploading...';
  const form = new FormData();
  form.append('file', selectedFile);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || (await res.text()) || 'upload failed');
    statusEl.textContent = `Queued ${body.queued} track(s) from "${body.playlist_title || 'playlist'}"` +
      (body.skipped ? ` (${body.skipped} skipped)` : '');
    fetchDownloads();
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    uploadBtn.disabled = false;
    selectedFile = null;
    fileInput.value = '';
    filenameEl.textContent = '';
  }
});

function fmtTime(iso) {
  if (!iso) return '\u2013';
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function fetchDownloads() {
  try {
    const res = await fetch('/api/downloads');
    const jobs = await res.json();
    renderRows(jobs || []);
  } catch (err) {
    // silent; will retry on next poll
  }
}

function renderRows(jobs) {
  const rows = document.getElementById('rows');
  const emptyMsg = document.getElementById('emptyMsg');
  if (!jobs.length) {
    rows.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';
  rows.innerHTML = jobs.map(j => `
    <tr>
      <td>${escapeHtml(j.name)}</td>
      <td><span class="badge ${j.status}">${j.status}</span></td>
      <td>${matchLabel(j.match_source)}</td>
      <td class="msg" title="${escapeHtml(j.message || '')}">${escapeHtml(j.message || '')}</td>
      <td>${fmtTime(j.started_at || j.created_at)}</td>
    </tr>
  `).join('');
}

function matchLabel(source) {
  const labels = {
    spotify_direct: 'Spotify link',
    musicbrainz_pending: 'MusicBrainz\u2026',
    musicbrainz: 'MusicBrainz \u2192 Spotify',
    search: 'Text search',
  };
  return `<span class="match">${labels[source] || source || '\u2013'}</span>`;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

fetchDownloads();
setInterval(fetchDownloads, 2000);
</script>
</body>
</html>
